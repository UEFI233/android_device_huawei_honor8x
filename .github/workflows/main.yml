name: 华为4.9内核集成KernelSU编译（Ubuntu 24.04适配）

on:
  push:
    branches: [ EMUI9.1-sukiultra ]
    paths:
      - 'kernel/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 安装基础依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libssl-dev \
            flex bison bc git wget curl

      - name: 手动安装Python 2.7（Ubuntu 24.04适配）
        run: |
          # 下载Python 2.7源码并编译
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          # 建立软链接
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2

      - name: 获取华为GCC交叉编译器
        run: |
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/pie-release.tar.gz -O gcc.tar.xz
          mkdir -p gcc
          tar -xf gcc.tar.xz -C gcc --strip-components=1
          echo "CC_PATH=$(pwd)/gcc/bin" >> $GITHUB_ENV

      - name: 编译内核
        run: |
          cd kernel
          export ARCH=arm64
          export PATH=$PATH:${{ env.CC_PATH }}
          export CROSS_COMPILE=aarch64-linux-android-
          make O=out XXXXXX_defconfig  # 替换为实际defconfig
          make O=out -j$(nproc)

      - name: 打包内核镜像
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz kernel/tools/
          sed -i -e 's/--kernel kernel/--kernel Image.gz/' kernel/tools/pack_kernerimage_cmd.sh
          sed -i -e 's/--output kernel.img/--output KernelSU_$(date +%Y%m%d).img/' kernel/tools/pack_kernerimage_cmd.sh
          bash kernel/tools/pack_kernerimage_cmd.sh

      - name: 生成GitHub发行版
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ github.sha }}
          files: kernel/tools/KernelSU_*.img
          body: "华为4.9系内核（EMUI9.1）集成KernelSU自动编译版本"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
