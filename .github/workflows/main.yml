name: 华为4.9内核编译（KernelSU适配版）

on:
  push:
    branches: [ EMUI9.1-sukiultra ]
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # 明确指定Ubuntu 24.04

    steps:
      - name: 拉取内核源码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆加速

      - name: 安装基础依赖（Ubuntu 24.04适配）
        run: |
          sudo apt update
          # 补充指南中提到的必要依赖，解决Ubuntu 24.04的兼容性
          sudo apt install -y build-essential libncurses5-dev libssl-dev \
            flex bison bc git wget curl unzip libelf-dev dwarves zstd \
            python3 python3-pip bison # 保留python3避免部分脚本依赖问题
           sudo apt install -y bison flex
          # 处理libncurses5在24.04的兼容问题
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5

      - name: 安装Python 2.7（Ubuntu 24.04专用脚本）
        run: |
          # 参考指南中Python 2.7安装方法，适配24.04
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local --enable-unicode=ucs4
          make -j$(nproc)
          sudo make install
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
          # 验证Python版本
          python --version || { echo "Python 2.7安装失败"; exit 1; }

      - name: 克隆GCC交叉编译器（稳定版本）
        run: |
          # 使用指南推荐的编译器版本，确保兼容性
          git clone --depth 1 https://github.com/Adrilaw/aarch64-linux-android-4.9-toolchain gcc
          # 验证编译器可执行文件和版本
          GCC_BIN="gcc/bin/aarch64-linux-android-gcc"
          if [ ! -f "$GCC_BIN" ]; then
            echo "错误：GCC编译器缺失 $GCC_BIN"
            exit 1
          fi
          $GCC_BIN --version || { echo "GCC版本验证失败"; exit 1; }

      - name: 预编译修复（补充dtc解析器生成）
        run: |
          # 修复Kconfig无效字符问题
          find . -name "Kconfig" -exec sed -i 's/[^[:print:]\t\n]//g' {} +
          # 修复dtc重复定义问题
          DTC_LEX="scripts/dtc/dtc-lexer.lex.c"
          if [ -f "$DTC_LEX" ]; then
            sed -i 's/YYLTYPE yylloc;/\/\/ YYLTYPE yylloc;/' "$DTC_LEX"
          fi
          # 手动生成dtc解析器代码（关键步骤）
          if [ ! -f "scripts/dtc/dtc-parser.tab.c" ]; then
            bison -o scripts/dtc/dtc-parser.tab.c -d scripts/dtc/dtc-parser.y
            flex -o scripts/dtc/dtc-lexer.lex.c scripts/dtc/dtc-lexer.l
          fi

      - name: 编译内核（带错误处理）
        run: |
          cd gcc
          export KERNEL_SRC=$(dirname $(pwd))
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/bin/aarch64-linux-android-
          export PATH=$(pwd)/bin:$PATH  # 确保编译器在PATH中
          
          cd $KERNEL_SRC
          # 加载配置并检查
          make O=out merge_kirin710_defconfig
          if [ ! -f "out/.config" ]; then
            echo "错误：配置文件生成失败"
            exit 1
          fi
          
          # 禁用不支持的栈保护（指南中提到的编译器兼容问题）
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' out/.config
          
          # 编译并输出详细日志，便于排错
          make O=out -j$(nproc) V=1 KCFLAGS=-Wno-error || {
            echo "编译失败，输出最后100行日志"
            tail -n 100 out/build.log
            exit 1
          }

      - name: 打包内核镜像（按指南规范）
        run: |
          # 确保输出目录存在
          mkdir -p out/boot
          cp out/arch/arm64/boot/Image.gz tools/
          # 适配指南中的打包脚本路径
          if [ -f "tools/pack_kernerimage_cmd.sh" ]; then
            sed -i -e 's/--kernel kernel/--kernel Image.gz/' tools/pack_kernerimage_cmd.sh
            sed -i -e "s/--output kernel.img/--output tools/KernelSU_$(date +%Y%m%d_%H%M).img/" tools/pack_kernerimage_cmd.sh
            bash tools/pack_kernerimage_cmd.sh
          else
            echo "警告：未找到打包脚本，直接输出Image.gz"
            cp out/arch/arm64/boot/Image.gz tools/KernelSU_$(date +%Y%m%d_%H%M).img
          fi

      - name: 生成GitHub发行版      - name: 克隆GCC交叉编译器仓库
        run: |
          git clone https://github.com/Adrilaw/aarch64-linux-android-4.9-toolchain gcc
          ls gcc/bin/aarch64-linux-android-gcc || { echo "GCC编译器缺失"; exit 1; }

      - name: 清理Kconfig无效字符
        run: |
          find . -name "Kconfig" -exec sed -i 's/[^[:print:]\t\n]//g' {} +

      - name: 在GCC目录下编译内核
        run: |
          cd gcc
          export KERNEL_SRC=$(dirname $(pwd))  # 内核源码在GCC目录的上一级
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/bin/aarch64-linux-android-
          ${CROSS_COMPILE}gcc --version  # 验证编译器
          cd $KERNEL_SRC
          make O=out merge_kirin710_defconfig
          make O=out -j$(nproc)

      - name: 打包内核镜像
        run: |
          cp out/arch/arm64/boot/Image.gz tools/
          sed -i -e 's/--kernel kernel/--kernel Image.gz/' tools/pack_kernerimage_cmd.sh
          sed -i -e 's/--output kernel.img/--output KernelSU_$(date +%Y%m%d).img/' tools/pack_kernerimage_cmd.sh
          bash tools/pack_kernerimage_cmd.sh

      - name: 生成GitHub发行版
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ github.sha }}
          files: tools/KernelSU_*.img
          body: "华为Kirin710内核（EMUI9.1）自动编译版本"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
